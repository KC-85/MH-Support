<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4c7b5" />
    <meta
      name="description"
      content="MH Support offers clear, compassionate and UK-focused mental health information in a calm, accessible space."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MH Support" />
    <meta
      property="og:description"
      content="Clear, compassionate and UK-focused mental health information in a calm, accessible space."
    />

    <script>
      const locationData = window.location

      if (locationData.search.startsWith('?/')) {
        const route = locationData.search
          .slice(1)
          .split('&')
          .map((segment) => segment.replace(/~and~/g, '&'))
          .join('?')

        window.history.replaceState(
          null,
          '',
          `${locationData.pathname.slice(0, -1)}${route}${locationData.hash}`,
        )
      }
    </script>

    <title>MH Support | Mental Health Information and Guidance</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to use MH Support.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
