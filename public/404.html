<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | MH Support</title>
    <script>
      const pathSegmentsToKeep = 1
      const locationData = window.location
      const basePath = locationData.pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/')
      const route = locationData.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~')
      const query = locationData.search
        ? `&${locationData.search.slice(1).replace(/&/g, '~and~')}`
        : ''

      locationData.replace(
        `${locationData.protocol}//${locationData.host}${basePath}/?/${route}${query}${locationData.hash}`,
      )
    </script>
  </head>
  <body>
    <p>Redirecting to MH Support…</p>
  </body>
</html>
